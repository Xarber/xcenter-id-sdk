name: SDK quality
on:
  pull_request:
    branches: [testing, beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: XCENTER_CHROME="$(command -v google-chrome)" npm test
      - run: python3 -m venv "$RUNNER_TEMP/uads" && "$RUNNER_TEMP/uads/bin/pip" install 'jsonschema==4.25.1' && "$RUNNER_TEMP/uads/bin/python" scripts/validate-uads.py
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift build
      - run: xcodebuild -scheme XCenterID -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --project-dir packages/android assembleRelease
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
